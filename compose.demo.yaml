x-local: &local
  platform: !reset null
  pull_policy: never

# <<: takes a single anchor; `<<: [*a, *b]` silently drops !reset (docker/compose#11706)
x-app: &app
  <<: *local
  volumes:
    - type: bind
      source: ./rag
      target: /home/frappe/frappe-bench/apps/rag
      bind:
        create_host_path: false
    - type: bind
      source: ./mariadb-client.cnf
      target: /home/frappe/.my.cnf
      read_only: true
      bind:
        create_host_path: false
  environment:
    # ponytail: the app is importable by path alone, so rag/pyproject.toml is never installed
    # and its dependencies come from drive's. Put them in the image when drive drops one.
    PYTHONPATH: /home/frappe/frappe-bench/apps/rag
    RAG_OLLAMA_URL: http://ollama:11434
    RAG_EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}

services:
  # configurator rebuilds sites/apps.txt from `ls -1 apps`, so it needs the mount too
  configurator:
    <<: *app
  backend:
    <<: *app
  websocket:    *local
  queue-short:
    <<: *app
  queue-long:
    <<: *app
  scheduler:
    <<: *app
  frontend:
    <<: *local
    environment:
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-demo.localhost}
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./nginx-realtime-auth.conf
        target: /etc/nginx/conf.d/realtime-auth.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      # the realtime service authenticates a socket by fetching the site's own name back, so
      # that name has to resolve inside the network too, not just in the browser
      default:
        aliases:
          - ${SITE_NAME:-demo.localhost}

  db:
    image: mariadb:12.3.3

  ollama:
    image: ollama/ollama:0.34.1
    environment:
      OLLAMA_NOPRUNE: "1"
    volumes:
      - type: bind
        source: ${HOME:?HOME must be set}/.ollama/models
        target: /root/.ollama/models
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  mcp:
    image: frappe-mcp-server:local
    pull_policy: never
    environment:
      FRAPPE_BASE_URL: http://frontend:8080
    volumes:
      - type: bind
        source: ./mcp/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - frontend
    restart: unless-stopped

  agent:
    image: frappe-ai-agent:local
    pull_policy: never
    environment:
      AI_AGENT_MCP_SERVER_URL: http://mcp:8080/mcp
      AI_AGENT_FRAPPE_URL: http://frontend:8080
      AI_AGENT_CORS_ORIGINS: '["http://${SITE_NAME:-demo.localhost}:${HTTP_PUBLISH_PORT:-8080}"]'
      AI_AGENT_LLM_BASE_URL: http://ollama:11434
      AI_AGENT_LLM_MODEL: ${AI_MODEL:-gemma4:26b}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import httpx; httpx.get('http://localhost:8484/health').raise_for_status()"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    ports:
      - "${AGENT_PUBLISH_PORT}:8484"
    depends_on:
      - mcp
      - ollama
    restart: unless-stopped
