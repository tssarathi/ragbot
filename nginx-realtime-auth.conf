# frappe's realtime service authenticates every socket by fetching the Origin header back
# (apps/frappe/realtime/utils.js get_url), and frappe_docker's nginx template synthesizes that
# header from $FRAPPE_SITE_NAME_HEADER with no port, so the fetch lands on port 80, nothing
# answers, and the socket dies with "Unauthorized: fetch failed". The AI sidebar is delivered
# entirely over socket.io, so that shows up as "Response timed out" with no answer at all.
#
# A real deployment answers on 80 under its own site name, so do the same here. Container-only:
# this port is never published to the host.
server {
	listen 80;
	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
	}
}
