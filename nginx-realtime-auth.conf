# frappe's realtime service authorises a socket by fetching the Origin header back
# (apps/frappe/realtime/utils.js), and frappe_docker's nginx synthesizes that header without a
# port, so the fetch lands on port 80 and every socket dies "Unauthorized: fetch failed". The
# AI sidebar is delivered entirely over socket.io, so it just says "Response timed out".
#
# Container-only, never published. The alternative is developer_mode plus webserver_port in the
# site config, which makes get_url rewrite the port, but that buys a socket fix with a global
# behaviour switch that anyone may turn off again.
server {
	listen 80;
	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
	}
}
